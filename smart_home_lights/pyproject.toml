[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "smarthome-lights"
version = "0.1.0"
description = "Control Matter/HomeKit lights through Home Assistant from Python."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.24",
    "click>=8.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
dev = [
    "pytest>=7.4",
    "respx>=0.20",
]

[project.scripts]
smarthome = "smarthome.cli:run"

[tool.setuptools]
packages = ["smarthome"]

[tool.pytest.ini_options]
testpaths = ["tests"]
